/* =========================
   전체
========================= */

}

/* =========================
   HEADER
========================= */

.chat-button {

/* =========================

.category-button.active {

}

.category-button.active::after {

  left: 0;
  right: 0;
  bottom: 0;

  height: 2px;

  background: #111;
}

/* =========================
   STORE FILTER
========================= */

.store-scroll {

.section-count {

/* =========================

========================= */

.product-grid {

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 8px;

  padding: 0 12px 25px;
}

/* =========================
   PRODUCT CARD
========================= */

.product-card {
  position: relative;

  overflow: hidden;

  border: 1px solid #ededeb;

  border-radius: 14px;

  background: #fff;

  transition:

}

.product-card:active {

}

/* =========================

.product-image {

}

.product-image img {

.image-placeholder {

.product-note {

.price-area {

.price-line {

.original-price {

}

.product-go {

  background: #f3f3f1;

  color: #222;

  font-size: 9px;

/* =========================

========================= */

.empty {

/* =========================

.join-button {

/* =========================
   FOOTER
========================= */

.footer {

/* =========================
   작은 화면
========================= */

@media (max-width: 360px) {

  .hero-title {
    font-size: 28px;
  }

    gap: 6px;

/* =========================

========================= */

@media (min-width: 700px) {

  body {
    background: #eeeeec;
  }

  .site {
    min-height: 100vh;

    box-shadow:
      0 0 50px rgba(0,0,0,.06);
  }

}

</style>

<script>

(function () {

  /* =========================
     판매처
  ========================= */

  var STORES = {

    coupang: {
      name: "쿠팡"
    },

    musinsa: {
      name: "무신사"
    },

    naver: {
      name: "네이버"
    },

    toss: {
      name: "토스"
    }

  };


  /* =========================
     상태
  ========================= */

  var deals = [];

  var currentCategory = "전체";

  var currentStore = "all";


  var list =
    document.getElementById("list");

  var count =
    document.getElementById("count");


  /* =========================
     숫자
  ========================= */

  function won(n) {

    return Number(n).toLocaleString("ko-KR");

  }


  /* =========================
     카테고리 자동 추정
     
     Worker 데이터에 category가 없어도
     상품명으로 자동 분류
  ========================= */

  function detectCategory(title) {

    var text =
      String(title || "").toLowerCase();


    var fashion = [
      "나이키",
      "아디다스",
      "뉴발란스",
      "푸마",
      "반팔",
      "긴팔",
      "티셔츠",
      "셔츠",
      "후드",
      "맨투맨",
      "바지",
      "팬츠",
      "청바지",
      "데님",
      "자켓",
      "재킷",
      "코트",
      "패딩",
      "가방",
      "백팩",
      "운동화",
      "신발",
      "스니커즈",
      "양말",
      "모자",
      "캡",
      "의류"
    ];


    var beauty = [
      "샴푸",
      "트리트먼트",
      "린스",
      "클렌징",
      "폼클렌징",
      "스킨",
      "토너",
      "에센스",
      "세럼",
      "크림",
      "로션",
      "선크림",
      "선스크린",
      "쿠션",
      "파운데이션",
      "립",
      "마스카라",
      "아이섀도",
      "화장품",
      "향수",
      "면도기",
      "면도날",
      "치약",
      "칫솔"
    ];


    var food = [
      "생수",
      "물",
      "커피",
      "아메리카노",
      "음료",
      "주스",
      "우유",
      "두유",
      "라면",
      "과자",
      "초콜릿",
      "빵",
      "김치",
      "고기",
      "돼지고기",
      "소고기",
      "닭",
      "치킨",
      "계란",
      "달걀",
      "쌀",
      "쌀밥",
      "즉석밥",
      "식품",
      "간식",
      "참치",
      "통조림"
    ];


    var digital = [
      "아이폰",
      "갤럭시",
      "스마트폰",
      "태블릿",
      "아이패드",
      "노트북",
      "맥북",
      "모니터",
      "키보드",
      "마우스",
      "이어폰",
      "헤드폰",
      "에어팟",
      "충전기",
      "충전",
      "케이블",
      "usb",
      "ssd",
      "하드디스크",
      "보조배터리",
      "전자"
    ];


    for (var i = 0; i < fashion.length; i++) {

      if (text.indexOf(fashion[i]) !== -1) {
        return "패션";
      }

    }


    for (var j = 0; j < beauty.length; j++) {

      if (text.indexOf(beauty[j]) !== -1) {
        return "뷰티";
      }

    }


    for (var k = 0; k < food.length; k++) {

      if (text.indexOf(food[k]) !== -1) {
        return "식품";
      }

    }


    for (var l = 0; l < digital.length; l++) {

      if (text.indexOf(digital[l]) !== -1) {
        return "디지털";
      }

    }


    return "생활";

  }


  /* =========================
     데이터 준비
  ========================= */

  function prepare(raw) {

    deals = (raw || []).map(function (d) {

      var ended = false;


      if (d.expires) {

        var t =
          new Date(
            String(d.expires)
              .replace(" ", "T")
          );


        ended =
          !isNaN(t) &&
          t < new Date();

      }


      var category =
        d.category ||
        detectCategory(d.title);


      return Object.assign({}, d, {

        ended: ended,

        category: category

      });

    });


    /*
      진행 중인 딜 먼저
      마감된 딜은 뒤로
    */

    deals =
      deals
        .filter(function (d) {
          return !d.ended;
        })
        .concat(
          deals.filter(function (d) {
            return d.ended;
          })
        );

  }


  /* =========================
     현재 필터
  ========================= */

  function getFilteredDeals() {

    return deals.filter(function (d) {

      var categoryOK =
        currentCategory === "전체" ||
        d.category === currentCategory;


      var storeOK =
        currentStore === "all" ||
        d.store === currentStore;


      return categoryOK && storeOK;

    });

  }


  /* =========================
     할인율
  ========================= */

  function getDiscount(d) {

    if (
      d.price &&
      d.original &&
      Number(d.original) > Number(d.price)
    ) {

      return Math.round(
        (1 - Number(d.price) / Number(d.original)) * 100
      );

    }

    return 0;

  }


  /* =========================
     뱃지
  ========================= */

  function getBadge(d) {

    /*
      직접 입력한 badge가 있으면 우선 사용
    */

    if (d.badge) {
      return d.badge;
    }


    var discount =
      getDiscount(d);


    if (discount >= 50) {
      return "역대급 특가";
    }


    if (discount >= 30) {
      return "할인 특가";
    }


    return "특가";

  }


  /* =========================
     카테고리 버튼
  ========================= */

  var categoryButtons =
    document.querySelectorAll(
      ".category-button"
    );


  categoryButtons.forEach(function (button) {

    button.addEventListener(
      "click",
      function () {

        currentCategory =
          button.dataset.category;


        categoryButtons.forEach(
          function (item) {

            item.classList.remove(
              "active"
            );

          }
        );


        button.classList.add("active");


        render();

      }
    );

  });


  /* =========================
     판매처 버튼
  ========================= */

  var storeButtons =
    document.querySelectorAll(
      ".store-button"
    );


  storeButtons.forEach(function (button) {

    button.addEventListener(
      "click",
      function () {

        currentStore =
          button.dataset.store;


        storeButtons.forEach(
          function (item) {

            item.classList.remove(
              "active"
            );

          }
        );


        button.classList.add("active");


        render();

      }
    );

  });


  /* =========================
     상품 렌더링
  ========================= */

  function render() {

    var shown =
      getFilteredDeals();


    /*
      개수
    */

    count.textContent =
      shown.length + "개의 딜";


    /*
      상품 없음
    */

    if (!shown.length) {

      list.innerHTML = "";

      var empty =
        document.createElement("li");

      empty.className = "empty";

      empty.textContent =
        "현재 해당 카테고리에 올라온 특가가 없어요.";

      list.appendChild(empty);

      return;

    }


    list.innerHTML = "";


    shown.forEach(function (d) {

      var store =
        STORES[d.store] || {
          name: d.store || "기타"
        };


      var discount =
        getDiscount(d);


      var li =
        document.createElement("li");


      var a =
        document.createElement("a");


      a.className =
        "product-card";


      a.href =
        d.url || "#";


      a.target =
        "_blank";


      a.rel =
        "sponsored noopener noreferrer";


      /* =====================
         이미지
      ===================== */

      var imageBox =
        document.createElement("div");


      imageBox.className =
        "product-image";


      if (d.image) {

        var img =
          document.createElement("img");


        img.src =
          d.image;


        img.alt =
          d.title || "";


        img.loading =
          "lazy";


        img.onerror =
          function () {

            this.style.display =
              "none";

          };


        imageBox.appendChild(img);

      } else {

        var placeholder =
          document.createElement("div");


        placeholder.className =
          "image-placeholder";


        placeholder.textContent =
          d.emoji || "DEALCENT";


        imageBox.appendChild(
          placeholder
        );

      }


      /* =====================
         뱃지
      ===================== */

      var badge =
        document.createElement("span");


      badge.className =
        "badge";


      badge.textContent =
        getBadge(d);


      imageBox.appendChild(
        badge
      );


      /* =====================
         정보
      ===================== */

      var info =
        document.createElement("div");


      info.className =
        "product-info";


      /* 메타 */

      var meta =
        document.createElement("div");


      meta.className =
        "product-meta";


      var storeName =
        document.createElement("span");


      storeName.textContent =
        store.name;


      var category =
        document.createElement("span");


      category.textContent =
        d.category || "생활";


      meta.appendChild(
        storeName
      );


      meta.appendChild(
        category
      );


      /* 제목 */

      var title =
        document.createElement("h2");


      title.className =
        "product-title";


      title.textContent =
        d.title || "";


      /* 설명 */

      var note =
        document.createElement("p");


      note.className =
        "product-note";


      note.textContent =
        d.note || "";


      /* 가격 */

      var priceArea =
        document.createElement("div");


      priceArea.className =
        "price-area";


      var priceLine =
        document.createElement("div");


      priceLine.className =
        "price-line";


      if (d.price) {

        var price =
          document.createElement("span");


        price.className =
          "price";


        price.textContent =
          won(d.price);


        priceLine.appendChild(
          price
        );


        var wonText =
          document.createElement("span");


        wonText.className =
          "won";


        wonText.textContent =
          "원";


        priceLine.appendChild(
          wonText
        );


        if (discount > 0) {

          var discountText =
            document.createElement("span");


          discountText.className =
            "discount";


          discountText.textContent =
            discount + "%";


          priceLine.appendChild(
            discountText
          );

        }

      }


      priceArea.appendChild(
        priceLine
      );


      /* 정상가 */

      if (
        d.original &&
        d.price &&
        Number(d.original) > Number(d.price)
      ) {

        var original =
          document.createElement("div");


        original.className =
          "original-price";


        original.textContent =
          won(d.original) + "원";


        priceArea.appendChild(
          original
        );

      }


      /* 버튼 */

      var button =
        document.createElement("button");


      button.type =
        "button";


      button.className =
        "product-go";


      button.textContent =
        d.ended
          ? "마감된 상품"
          : "상품 보러가기 →";


      /*
        a 안에 button이 들어가므로
        클릭만 막지 않고 링크는 그대로 작동
      */

      button.addEventListener(
        "click",
        function (event) {

          event.preventDefault();

          if (d.url) {

            window.open(
              d.url,
              "_blank",
              "noopener"
            );

          }

        }
      );


      info.appendChild(meta);

      info.appendChild(title);

      info.appendChild(음표);

      info.appendChild(priceArea);

      info.appendChild(button);


      a.appendChild(imageBox);

      a.appendChild(info);


      li.appendChild(a);

      list.appendChild(li);

    });

  }


  /* =========================
     처음 로딩
  ========================= */

  count.textContent =
    "불러오는 중";


  list.innerHTML = "";


  var loading =
    document.createElement("li");


  loading.className =
    "empty";


  loading.textContent =
    "특가를 불러오는 중이에요...";


  list.appendChild(
    loading
  );


  /* =========================
     API
  ========================= */

  fetch(
    "/api/deals",
    {
      cache: "no-cache"
    }
  )

    .then(function (response) {

      if (!response.ok) {

        throw new Error(
          "API 오류"
        );

      }

      return response.json();

    })

    .then(function (data) {

      prepare(
        data.deals || []
      );


      render();

    })

    .catch(function () {

      count.textContent =
        "";


      list.innerHTML = "";


      var error =
        document.createElement("li");


      error.className =
        "empty";


      error.textContent =
        "특가를 불러오지 못했어요. 잠시 후 새로고침해 주세요.";


      list.appendChild(
        error
      );

    });

})();

</script>

</body>
</html>
